<svg
  width="512"
  height="512"
  viewBox="0 0 32 32"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Fundo laranja arredondado -->
  <rect width="32" height="32" rx="8" fill="#F97316" />

  <!-- Espinha central: dente do meio + cabo -->
