    x1="16" y1="5"
    x2="16" y2="27"
    stroke="white" stroke-width="2.5" stroke-linecap="round"
  />

  <!-- Dente esquerdo -->
  <path
    d="M10 5 L10 13 Q10 17 16 17"
    stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Dente direito -->
  <path
    d="M22 5 L22 13 Q22 17 16 17"
    stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"
  />
</svg>
