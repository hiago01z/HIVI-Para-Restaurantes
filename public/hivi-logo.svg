<svg
  width="200"
  height="48"
  viewBox="0 0 200 48"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Ícone: fundo laranja arredondado (48x48 escalado para 32x32 viewBox → scale 1.5) -->
  <rect width="48" height="48" rx="12" fill="#F97316" />

  <!-- Garfo (escalonado de viewBox 32→48, multiplicador 1.5) -->
  <!-- Espinha central -->
  <line
    x1="24" y1="7.5"
    x2="24" y2="40.5"
    stroke="white" stroke-width="3.75" stroke-linecap="round"
  />
  <!-- Dente esquerdo -->
  <path
    d="M15 7.5 L15 19.5 Q15 25.5 24 25.5"
    stroke="white" stroke-width="3.75" fill="none" stroke-linecap="round" stroke-linejoin="round"
  />
  <!-- Dente direito -->
  <path
    d="M33 7.5 L33 19.5 Q33 25.5 24 25.5"
    stroke="white" stroke-width="3.75" fill="none" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Texto HIVI -->
  <text
    x="62"
    y="34"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="3"
    fill="#0f172a"
  >HIVI</text>
</svg>
